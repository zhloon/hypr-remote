[package]
name = "hypr-remote-client"
version = "0.1.0"
description = "Cross-platform Wayland & Hyprland Remote Desktop Client"
authors = ["HyprRemote Team"]
edition = "2021"

[lib]
name = "hypr_remote_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
libc = "0.2"
socket2 = "0.6"

